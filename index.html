    <!-- Light is the default. Dark applies only when the visitor explicitly
         chose it before, and the class lands before first paint so there is no
         flash of the wrong theme. -->
    <script>
      (function () {
        try {
          if (localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {
          /* storage blocked (private mode) — stay on the light default */
        }
      })();
    </script>

    <!-- gtag.js is ~170 KB and costs ~220 ms of main-thread time — on its own,
         more blocking time than the entire app. So it loads on the visitor's
         first interaction, or after 10 s for someone who just reads. Trade-off:
         a visit that leaves inside 10 s without interacting isn't counted. -->
    <script>
      (function () {
        var started = false;
        var events = ['pointerdown', 'keydown', 'scroll', 'touchstart'];

        function loadAnalytics() {
          if (started) return;
          started = true;
          events.forEach(function (e) { window.removeEventListener(e, loadAnalytics); });
          var s = document.createElement('script');
          s.async = true;
          s.src = 'https://www.googletagmanager.com/gtag/js?id=G-JWH0F3L29D';
          document.head.appendChild(s);
          window.dataLayer = window.dataLayer || [];
          window.gtag = function () { window.dataLayer.push(arguments); };
          window.gtag('js', new Date());
          window.gtag('config', 'G-JWH0F3L29D');
        }

        events.forEach(function (e) {
          window.addEventListener(e, loadAnalytics, { once: true, passive: true });
        });
        setTimeout(loadAnalytics, 10000);
      })();
    </script>
  </body>
